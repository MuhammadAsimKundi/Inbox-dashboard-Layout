<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- google fonts -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600&display=swap"
        rel="stylesheet">
    <!-- font awesones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="parent">

        <!-- sidebar here -->
        <div class="sideBar">
            <div class="red-square"></div>
            <ul>
                <li><i class="fa-solid fa-gauge-high"></i></li>
                <li><i class="fa-regular fa-user"></i></li>
                <li><i class="fa-solid fa-briefcase"></i></li>
                <li><i class="fa-solid fa-user-group"></i></li>
                <li><i class="fa-solid fa-phone"></i></li>
                <li><i class="fa-regular fa-file-lines"></i></li>
                <li><i class="fa-solid fa-robot"></i></li>
                <li><i class="fa-solid fa-phone-volume"></i></li>
                <li><i class="fa-solid fa-gear"></i></li>
            </ul>
        </div>

        <!-- Main content here -->
        <div class="main">

            <!-- navbar component-->
            <nav-bar></nav-bar>



            <!-- parent div for top row and three colums -->
            <div class="chat-Parent">

                <!-- div for small buttons alike for h3-contactCenter, credits and date etc -->
                <div class="credits-data">
                    <p>Contact Center</p>
                    <!-- <div class="credits">
                        <p>Credits &nbsp;&nbsp;</p>
                        <div>
                            <span>¢</span>
                            <p>69,583,322,187</p>
                        </div>
                        <p><i class="fa-solid fa-calendar-days " style="color: #8c45ff; font-size: 1.2rem;"></i> Jan 02, 2019 - Feb 15, 2020</p>
                    </div> -->
                    <app-credits class="credits"  
                        amount="69,583,322,187"
                        start="Jan 02, 2019"
                        end="">
                    </app-credits>
                
                </div>

                <!-- side bar that contains all the platforms buttons like wattsapp, contacts, messages, inbox etc -->
                <ul class="chat-sideBar">
                    <li><img src="./images/contacts.png" alt=""></li>
                    <li><img src="./images/call.png" alt="icon image"></li>
                    <li><img src="./images/message.png" alt="icon image"></li>
                    <li><img src="./images/mail.png" alt="icon image"></li>
                    <li><img src="./images/wattsapp.png" alt="icon image"></li>
                    <hr style="width: 100%;">
                    <li><img src="./images/setting.png" alt="icon image"></li>
                    <li><img src="./images/eye.png" alt="icon image"></li>
                    <li><img src="./images/signal.png" alt="icon image"></li>
                </ul>

                <!-- div component that contains search-bar and all the recents chats -->
                <recent-chats class="recentChats"></recent-chats>


                <!--------------------------------------------------------------------------------------------- -->

                <!-- div that has the open chat -->
                <open-chats class="openChat" id="chatPanel"></open-chats>
                <!-- <open-chat class="openChat js-openChat"></open-chat> -->
            </div>


        </div>
    </div>
    <!-- <script type="module" src="./scripts/main.js"></script> -->
    <script type="module" src="./components/nav-bar.js"></script>
    <script type="module" src="./components/credits.js"></script>
    <script type="module" src="./components/firstChat.js"></script>
    <script type="module" src="./components/openChat.js"></script>
    <script type="module" src="./components/ChatSidebar.js"></script>
    <script type="module" src="./components/searchSidebar.js"></script>

</body>

</html>
